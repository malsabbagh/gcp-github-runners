name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the checked-in lock without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Require the complete setup qualification runtime
        run: command -v pwsh
      - name: Current source archive and pinned dependency closure
        run: npm run check:archive
      - name: All Node, Jest and Python suites with coverage above 80 percent per production file
        run: npm run test:coverage-check
      - name: Review trigger identity regressions without network access
        if: ${{ hashFiles('.github/workflows/review-sensei-review.yml') != '' }}
        run: python .github/scripts/test-review-trigger.py
      - name: JavaScript, Python and Bash syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import subprocess
          roots = ['controller-entry.js', 'cloud-functions', 'packaging', 'scripts', 'startup', 'tests', '.github/scripts']
          for root in roots:
              path = Path(root)
              paths = [path] if path.is_file() else path.rglob('*')
              for file in paths:
                  if not file.is_file() or any(part in ('node_modules', 'coverage', '__pycache__') for part in file.parts):
                      continue
                  if file.suffix in ('.js', '.cjs'):
                      subprocess.run(['node', '--check', str(file)], check=True)
                  elif file.suffix == '.py':
                      ast.parse(file.read_text(), filename=str(file))
                  elif file.suffix == '.sh':
                      subprocess.run(['bash', '-n', str(file)], check=True)
          PY
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failures = 0
          foreach ($path in Get-ChildItem scripts -Recurse -Filter '*.ps1') {
            $tokens = $null; $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($path.FullName, [ref]$tokens, [ref]$errors)
            foreach ($error in $errors) { Write-Output ($path.Name + ': ' + $error.Message); $failures++ }
          }
          if ($failures -ne 0) { exit 1 }

  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@651471c36a6092792c552e8b1bef71e592b462d8 # v3.1.1
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Terraform formatting
        run: terraform fmt -check -recursive terraform
      - name: Initialize providers without a backend
        working-directory: terraform
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate the portable infrastructure contract
        working-directory: terraform
        run: terraform validate -no-color
      - name: Mocked infrastructure and IAM contract regressions
        working-directory: terraform
        run: terraform test -no-color
