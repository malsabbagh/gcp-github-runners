# ReviewSensei setup version: 5
name: Prepare ReviewSensei removal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Prepare removal patch for a commit with the operator's identity
        run: |
          set -euo pipefail
          git rm --ignore-unmatch -- \
            .github/workflows/review-sensei-review.yml \
            .github/workflows/review-sensei-uninstall.yml \
            .github/scripts/test-review-trigger.py \
            .reviewsensei.yml \
            .github/review-sensei/config.yml
          git diff --cached --binary > "$RUNNER_TEMP/review-sensei-removal.patch"
          echo 'Download the patch, inspect it, and apply/commit it locally with your verified Git identity.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This workflow does not commit, push, uninstall an App, or delete secrets.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save removal patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: review-sensei-removal
          path: ${{ runner.temp }}/review-sensei-removal.patch
          retention-days: 1
          if-no-files-found: error
