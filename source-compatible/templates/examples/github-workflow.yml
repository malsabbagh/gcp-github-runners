# Example GitHub Actions Workflow for Self-Hosted Runners
# This workflow demonstrates how to use the auto-deployed self-hosted runners

name: CI with Auto-Deployed Runners

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # This job will automatically trigger runner deployment via webhook
  test-on-self-hosted:
    runs-on: self-hosted  # This will trigger the webhook to create a runner
    
    # Optional: Add labels to target specific runner types
    # runs-on: [self-hosted, linux, pr]  # For PR-specific runners
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up environment
      run: |
        echo "Running on self-hosted runner"
        echo "Runner name: $RUNNER_NAME"
        echo "Runner OS: $RUNNER_OS"
        echo "Runner architecture: $RUNNER_ARCH"
        
        # Display runner information
        hostname
        whoami
        pwd
        
    - name: Install dependencies
      run: |
        # Example for Node.js project
        if [ -f "package.json" ]; then
          npm ci
        fi
        
        # Example for Python project
        if [ -f "requirements.txt" ]; then
          pip install -r requirements.txt
        fi
        
    - name: Run tests
      run: |
        # Example test commands
        echo "Running tests..."
        
        # Node.js
        if [ -f "package.json" ]; then
          npm test
        fi
        
        # Python
        if [ -f "pytest.ini" ] || [ -f "setup.cfg" ]; then
          pytest
        fi
        
        # Go
        if [ -f "go.mod" ]; then
          go test ./...
        fi
        
    - name: Build application
      run: |
        echo "Building application..."
        
        # Add your build commands here
        # Examples:
        # npm run build
        # go build
        # docker build -t myapp .
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          test-results/
          logs/
          *.log
          
  # Example of a job that runs on different runner types based on event
  conditional-runner:
    runs-on: ${{ github.event_name == 'pull_request' && 'self-hosted' || 'ubuntu-latest' }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Show context
      run: |
        echo "Event: ${{ github.event_name }}"
        echo "Runner type: ${{ runner.os }}"
        echo "Is self-hosted: ${{ contains(runner.name, 'runner-') }}"
        
  # Job that only runs on PRs and uses self-hosted runners
  pr-specific-job:
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    
    steps:
    - name: Checkout PR code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        
    - name: PR-specific tasks
      run: |
        echo "PR Number: ${{ github.event.number }}"
        echo "PR Title: ${{ github.event.pull_request.title }}"
        echo "PR Author: ${{ github.event.pull_request.user.login }}"
        
        # Add PR-specific testing, validation, etc.
        
  # Matrix job example with self-hosted runners
  matrix-test:
    strategy:
      matrix:
        node-version: [16, 18, 20]
        
    runs-on: self-hosted
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        
    - name: Run tests with Node ${{ matrix.node-version }}
      run: |
        node --version
        npm --version
        # Add your test commands
        
  # Cleanup job (optional - runners auto-cleanup after 2 hours)
  cleanup:
    if: always()
    needs: [test-on-self-hosted, conditional-runner, pr-specific-job, matrix-test]
    runs-on: ubuntu-latest  # Use GitHub-hosted for cleanup
    
    steps:
    - name: Trigger cleanup
      run: |
        echo "Workflow completed"
        echo "Self-hosted runners will auto-cleanup after 2 hours"
        # Optional: You could trigger immediate cleanup via API call
