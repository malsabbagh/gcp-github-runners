# Copy into a trusted private workload repository after deployment qualification.
name: Dedicated GCP one-job worker
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.event.repository.private == true
    runs-on: [self-hosted, linux, x64, gcp-one-job]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: printf '%s\n' 'Run trusted private workload here'
