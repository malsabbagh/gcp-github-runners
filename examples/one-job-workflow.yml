# Copy into a trusted private workload repository after deployment qualification.
name: Dedicated GCP one-job smoke test
on:
  workflow_dispatch:
permissions: {}
jobs:
  build:
    if: github.event.repository.private == true
    runs-on: [self-hosted, linux, x64, gcp-one-job]
    timeout-minutes: 5
    steps:
      - name: Verify the native unprivileged worker executes a job
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(id -u)" -ne 0
          printf '%s\n' 'GCP one-job worker executed the smoke test'
